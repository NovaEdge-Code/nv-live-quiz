<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a2233;--sub:#5b6577;--line:#dfe4ec;--soft:#f4f7fc;--blue:#1f5fd1;--blue-d:#163f8c;--blue-l:#e8f0fd;
  --ok:#1b8a5a;--ok-l:#e3f3ea;--warn:#d97706;--warn-l:#fdf1e2;--ng:#c2410c;
  --font:"Inter","Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;--latin:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:var(--ink)}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;min-height:100vh;min-height:100dvh;word-break:auto-phrase;overflow-wrap:break-word;font-size:17px}
.band{height:6px;background:var(--blue)}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--latin);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;line-height:1.3}
.brand span{display:block;color:var(--sub);font-weight:500;letter-spacing:.06em;text-transform:none;font-size:12px}
.me{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:7px;min-width:0}
.me span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.dot{width:9px;height:9px;border-radius:50%;background:#b9bfcb;flex:none}.dot.on{background:var(--ok)}
.off{display:none;margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--warn-l);color:#8a4b00;font-size:14px;line-height:1.6}
.off.show{display:block}
.kick{font-family:var(--latin);font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--blue);text-transform:uppercase;margin-top:26px}
h1{font-weight:700;font-size:27px;line-height:1.4;margin-top:8px}
.lead{font-size:16px;line-height:1.75;color:var(--sub);margin-top:10px}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--ink);margin:24px 0 8px}
input{width:100%;font:inherit;font-size:18px;padding:15px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.btn{display:block;width:100%;margin-top:20px;min-height:58px;padding:16px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.btn:disabled{background:#c8d3e6;color:#fff}
.btn.sticky{position:sticky;bottom:max(12px,env(safe-area-inset-bottom));box-shadow:0 0 0 12px #fff}
.priv{font-size:13px;color:var(--sub);margin-top:14px;line-height:1.65;padding:10px 12px;background:var(--soft);border-radius:10px}
.rh{display:inline-block;margin-top:14px;font-size:12px;font-weight:700;color:#fff;background:var(--warn);padding:4px 10px;border-radius:6px;letter-spacing:.04em}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.qno{font-family:var(--latin);font-size:13px;font-weight:600;color:var(--blue);letter-spacing:.14em}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--sub)}
.tag.closed{background:var(--ng);color:#fff}
.q{font-size:20px;font-weight:700;line-height:1.6;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;min-height:64px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);cursor:pointer}
.opt .n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);display:grid;place-items:center;font-size:16px;font-weight:700;font-family:var(--latin)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:inset 0 0 0 1px var(--blue)}.opt.sel .n{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}.opt.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.mine{box-shadow:inset 0 0 0 1px var(--ink)}
.opt.ng{opacity:.5}.opt:disabled{cursor:default}
.opt .you{margin-left:auto;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .25s linear}
.tleft{font-size:13px;color:var(--sub);margin-top:6px;font-family:var(--latin);font-variant-numeric:tabular-nums}
.msg{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:15px;line-height:1.7;color:var(--sub)}
.msg.ok{background:var(--ok-l);color:#11603d}
.msg.warn{background:var(--warn-l);color:#8a4b00}
.res{margin-top:18px;padding:18px;border-radius:14px;border:1.5px solid var(--line)}
.res .r{font-weight:700;font-size:22px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.res .r .pts{font-family:var(--latin);font-size:26px;font-weight:700}
.score.big b{font-size:40px}
.res.ok{border-color:var(--ok);background:var(--ok-l)}.res.ok .r{color:var(--ok)}
.res.ng .r{color:var(--ng)}
.res .a{font-size:14px;color:var(--sub);margin-top:4px}
.res p{font-size:15px;line-height:1.8;color:var(--ink);margin-top:10px}
.res p b{color:var(--blue-d)}
.score{display:flex;gap:10px;margin-top:16px}
.score div{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.score span{display:block;font-size:12px;color:var(--sub)}
.score b{font-family:var(--latin);font-weight:300;font-size:32px}
.score b small{font-size:16px;color:var(--sub);margin-left:4px}
.wait{text-align:center;padding:46px 0 14px}
.wait .ring{width:54px;height:54px;border-radius:50%;border:3px solid var(--blue-l);border-top-color:var(--blue);margin:0 auto 18px;animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:34px;font-size:11px;color:var(--sub);text-align:center;line-height:1.7}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;margin-top:12px;padding:8px}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
  <header>
    <div class="brand" id="brand"></div>
    <div class="me"><span class="dot" id="dot"></span><span id="mel"></span></div>
  </header>
  <div class="off" id="off"></div>
  <main id="app"></main>
  <div class="foot" id="foot"></div>
</div>
<script src="mqtt.min.js"></script>
<script src="sync.js"></script>
<script>
/* Participant page. Text and questions come from quiz.<lang>.js (generated by build.py from the deck content;
   it never contains the answers). ?lang=ja|en chooses the language, ?t=<topic> joins a rehearsal topic. */
const DEFAULT_LANG='ja';   // change to 'en' once quiz.en.js has been built
(function(){const qp=new URLSearchParams(location.search);const want=(qp.get('lang')||DEFAULT_LANG).toLowerCase().replace(/[^a-z]/g,'').slice(0,5)||DEFAULT_LANG;
  function load(l,fallback){const s=document.createElement('script');s.src='quiz.'+l+'.js';s.onload=()=>boot();
    s.onerror=()=>{if(fallback&&l!==DEFAULT_LANG)load(DEFAULT_LANG,false);else document.getElementById('app').textContent='quiz data not found'};document.head.appendChild(s)}
  load(want,true)})();

function boot(){
const PACK=window.QUIZ_PACK,STR=PACK.str,QUIZ=PACK.quiz,TOPIC=PACK.topic;
document.documentElement.lang=PACK.lang;document.title=STR.title;
const fmt=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>(o&&k in o)?o[k]:m);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escB=s=>esc(s).replace(/&lt;(\/?)b&gt;/g,'<$1b>');
$('#brand').innerHTML=`${esc(STR.brand)}<span>${esc(STR.brandSub)}</span>`;$('#foot').textContent=STR.foot;
const tq=new URLSearchParams(location.search).get('t');
const TP=(tq&&/^[A-Za-z0-9_-]{3,60}$/.test(tq))?tq:TOPIC;
const REHEARSAL=TP!==TOPIC;
const KEY='iw-quiz-player-'+TP;
const ONLY=(new URLSearchParams(location.search).get('mq')||'').split(',').filter(x=>/^[a-z]+$/.test(x)); // testing: restrict brokers
let S={pid:null,name:'',sid:null,ans:{},rt:{},shown:{},hist:{},pend:false,skew:0};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)S=Object.assign(S,v)}catch(e){}
if(!S.pid)S.pid=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
S.hist=S.hist||{};S.ans=S.ans||{};S.rt=S.rt||{};S.shown=S.shown||{};S.skew=+S.skew||0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
save();
let C=null,NET={},sending=false,tick=null,pick=null,lastSent=0,editing=false,draft=null;
const NQ=()=>QUIZ.length;

function snapshot(){return {v:3,sid:S.sid||'',pid:S.pid,name:S.name,ans:S.ans,rt:S.rt,ts:Date.now(),mq:sync.mqttUp()}}
async function push(kind){
  /* without a session id we can only say hello in last-resort mode (lets the host start posting to ntfy) */
  if(!S.name||(!S.sid&&!sync.fallback()))return false;
  if(S.purged&&S.purged===S.sid)return false;                       // host purged this session's public data
  if(kind==='sync'&&!(C&&C.sid===S.sid&&C.phase!=='end'))return false;  // sync only while a live session is running
  const ok=await sync.publishPlayer(snapshot(),kind==='sync'?'never':'answer');
  if(ok){lastSent=Date.now();if(S.pend){S.pend=false;save()}}
  return ok;
}
function netOK(){return Object.values(NET).some(v=>v==='live')}
/* same formula as the deck: correct → base + bonus × (remaining / limit); response time measured on this phone */
function ptsFor(q,a){if(!C||!C.ra||C.ra[q]==null||S.ans[q]==null||S.ans[q]!==C.ra[q])return 0;const lim=(C.lim||30)*1000,sb=C.sb||[500,500];
  const r=Math.max(0,Math.min(lim,S.rt[q]==null?lim:S.rt[q]));return Math.round(sb[0]+sb[1]*(1-r/lim))}
function myScore(){let c=0,r=0,p=0;if(C&&C.ra)Object.entries(C.ra).forEach(([q,a])=>{r++;if(S.ans[q]===a)c++;p+=ptsFor(q)});return {c,r,p}}
const num=n=>Number(n).toLocaleString('en-US');
function scoreBox(){const m=myScore();return m.r?`<div class="score"><div><span>${esc(STR.totalLabel)}</span><b>${fmt(STR.ptsFmt,{p:num(m.p)})}</b></div><div><span>${esc(STR.scoreLabel)}</span><b>${fmt(STR.scoreOf,{c:m.c,r:m.r})}</b></div></div>`:''}
function header(){
  $('#mel').textContent=S.name&&!editing?S.name:(netOK()?STR.connected:STR.connecting);
  $('#dot').className='dot'+(netOK()?' on':'');
  const off=$('#off');const fb=sync&&sync.fallback(),down=Object.keys(NET).length&&!netOK();off.textContent=fb?STR.fallback:STR.offline;off.classList.toggle('show',!!((down||fb)&&S.name));
}
function render(){
  header();
  if(!S.name||editing)return renderJoin();
  if(!C||C.phase==='lobby'||C.sid!==S.sid)return renderWait();
  if(C.phase==='end')return renderEnd();
  const q=QUIZ[C.q-1];if(!q)return renderWait(STR.prepH,'');
  if(C.phase==='open')return renderQ(q,C.q);
  if(C.phase==='closed')return renderQ(q,C.q,true);
  if(C.phase==='reveal')return renderReveal(q,C.q);
  renderWait(STR.prepH,'');
}
function renderJoin(){
  clearInterval(tick);const val=draft!=null?draft:S.name;
  $('#app').innerHTML=`${S.wasReset?`<div class="msg warn" id="rsm">${esc(STR.resetMsg||'')}</div>`:''}<div class="kick">${esc(STR.joinKick)}</div><h1>${esc(STR.joinH)}</h1>
  <p class="lead">${esc(fmt(STR.joinLead,{n:NQ()}))}</p>${REHEARSAL?`<span class="rh">${esc(STR.rehearsal)}</span>`:''}
  <label class="lbl" for="nm">${esc(STR.nameLabel)}</label>
  <input id="nm" maxlength="30" autocomplete="nickname" enterkeyhint="go" placeholder="${esc(STR.namePh)}" value="${esc(val)}">
  <button class="btn" id="go" ${val.trim()?'':'disabled'}>${esc(STR.joinBtn)}</button>
  <p class="priv">${esc(STR.privacy)}</p>`;
  const i=$('#nm'),b=$('#go');
  i.addEventListener('input',()=>{draft=i.value;b.disabled=!i.value.trim()});
  const join=()=>{const nm=i.value.replace(/\s+/g,' ').trim().slice(0,30);if(!nm){alert(STR.nameNeeded);return}
    S.name=nm;S.wasReset=false;editing=false;draft=null;save();push('join');render()};
  b.onclick=join;i.addEventListener('keydown',e=>{if(e.key==='Enter')join()});
}
function renderWait(h,p){
  clearInterval(tick);
  $('#app').innerHTML=`<div class="wait"><div class="ring"></div><h1 style="font-size:22px">${esc(h||STR.waitH)}</h1><p class="lead">${esc(p==null?STR.waitP:p)}</p></div>
  <div class="msg">${esc(fmt(STR.joinedAs,{name:S.name}))}</div>${REHEARSAL?`<span class="rh">${esc(STR.rehearsal)}</span>`:''}${scoreBox()}
  <p class="priv">${esc(STR.privacy)}</p>
  <div style="text-align:center"><button class="link" id="chg">${esc(STR.changeName)}</button></div>`;
  $('#chg').onclick=()=>{if(confirm(STR.confirmChange)){editing=true;render()}};
}
function deadline(){return (C&&C.dl)||0}
function renderQ(q,n,closedPhase){
  const done=S.ans[n]!=null,closed=!!closedPhase||Date.now()>deadline();
  if(!done&&!closed&&C&&C.phase==='open'){const sh=S.shown[n];if(!sh||sh.oa!==C.openAt){S.shown[n]={at:Date.now(),oa:C.openAt};save()}}
  if(!done&&pick&&pick.n!==n)pick=null;
  const sel=done?S.ans[n]:(pick?pick.a:null),nn=String(n).padStart(2,'0');
  $('#app').innerHTML=`<div class="qmeta"><span class="qno">${esc(fmt(STR.qno,{nn,t:NQ()}))}</span>${closed?`<span class="tag closed">${esc(STR.closedTag)}</span>`:''}</div>
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt${sel===k+1?' sel':''}" data-a="${k+1}" ${done||closed?'disabled':''}><span class="n">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div>
  ${closed?'':`<div class="bar"><i id="tb"></i></div><div class="tleft" id="tl"></div>`}
  ${done?(S.pend?(sending?`<div class="msg">${esc(STR.sending)}</div>`:`<div class="msg warn">${esc(STR.pending)}</div>`):`<div class="msg ok">${esc(STR.sent)}</div>`):closed?`<div class="msg">${esc(STR.closedMsg)}</div>`:`<button class="btn sticky" id="sub" ${sel?'':'disabled'}>${esc(sel?fmt(STR.sendN,{a:sel}):STR.pick)}</button>`}`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick={n,a:+b.dataset.a};renderQ(q,n,closedPhase)});
  const sb=$('#sub');if(sb)sb.onclick=async()=>{
    if(sending||!pick)return;sending=true;
    const lim=(C.lim||30)*1000,sh=S.shown[n];S.rt[n]=Math.max(0,Math.min(lim,Date.now()-(sh?sh.at:Date.now())));
    S.ans[n]=pick.a;S.pend=true;save();renderQ(q,n,closedPhase);
    await push('answer');sending=false;if(C&&C.q===n&&['open','closed'].includes(C.phase)&&!editing)render();
  };
  clearInterval(tick);if(closed)return;
  const tot=(C.dur||30)*1000;
  const up=()=>{const r=Math.max(0,deadline()-1500-Date.now());const tb=$('#tb'),tl=$('#tl');if(!tb)return;tb.style.width=Math.min(100,100*r/tot)+'%';tl.textContent=r>0?fmt(STR.left,{s:Math.ceil(r/1000)}):STR.timeUp;
    if(Date.now()>deadline()){clearInterval(tick);renderQ(q,n,closedPhase)}};
  up();tick=setInterval(up,250);
}
function renderReveal(q,n){
  clearInterval(tick);const A=C.ra&&C.ra[n];const R=(C.lang===PACK.lang&&C.rev)||{};const my=S.ans[n],ok=my!=null&&my===A,nn=String(n).padStart(2,'0');
  $('#app').innerHTML=`<div class="qmeta"><span class="qno">${esc(fmt(STR.qno,{nn,t:NQ()}))}</span></div>
  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o,k)=>`<button class="opt ${k+1===A?'ok':'ng'}${my===k+1?' mine':''}" disabled><span class="n">${k+1}</span><span>${esc(o)}</span>${my===k+1?`<span class="you">${esc(STR.you)}</span>`:''}</button>`).join('')}</div>
  <div class="res ${my==null?'':ok?'ok':'ng'}"><div class="r">${esc(my==null?STR.unanswered:ok?STR.correct:STR.wrong)}<span class="pts">+${num(ptsFor(n))}</span></div><div class="a">${esc(fmt(STR.answerIs,{a:A}))}</div>${R.e?`<p>${escB(R.e)}</p>`:''}</div>
  ${scoreBox()}`;
}
function renderEnd(){
  clearInterval(tick);const m=myScore();
  const sc=Array.isArray(C.sc)?C.sc.filter(x=>typeof x==='number'):[],np=+C.np||sc.length;const rank=sc.length?1+sc.filter(x=>x>m.p).length:0;
  $('#app').innerHTML=`<div class="kick">${esc(STR.endKick)}</div><h1>${esc(STR.endH)}</h1><p class="lead">${esc(STR.endP)}</p>
  <div class="score big"><div><span>${esc(STR.totalLabel)}</span><b>${fmt(STR.ptsFmt,{p:num(m.p)})}</b></div>${rank?`<div><span>${esc(STR.rankLabel)}</span><b>${fmt(STR.rankFmt,{r:rank,n:np})}</b></div>`:''}</div>
  <div class="score"><div><span>${esc(STR.scoreLabel)}</span><b>${fmt(STR.scoreOf,{c:m.c,r:m.r})}</b></div></div>`;
}
function validCtl(m){return m&&typeof m.sid==='string'&&typeof m.ts==='number'&&['lobby','open','closed','reveal','end'].includes(m.phase)
  &&(m.phase==='lobby'||m.phase==='end'||(Number.isInteger(m.q)&&m.q>=1&&m.q<=QUIZ.length))}
/* 「リハーサル後の全リセット」 on the deck: forget this session, clear our public snapshot, back to the join screen
   (the nickname stays filled in). Triggered by the reset signal, or by a new reset epoch (rs) in the session state. */
function resetHere(rs){
  if(S.pid&&S.name)sync.clearOwn(S.pid);
  draft=S.name||draft;S.name='';S.sid=null;S.ans={};S.rt={};S.shown={};S.hist={};S.pend=false;S.purged=null;S.rs=rs;S.wasReset=true;
  C=null;pick=null;editing=false;save();render();
}
function onCtl(m,src,retained){
  if(!validCtl(m))return;
  /* reset epochs are "<ms>-<random>"; only a newer one counts (an old retained state must never kick anyone out) */
  if(typeof m.rs==='string'&&m.rs){const t=x=>parseInt(x,10)||0,newer=!S.rs||t(m.rs)>t(S.rs);
    if(m.reset){if(newer&&S.rs!==m.rs){if(S.name)resetHere(m.rs);else{S.rs=m.rs;save()}}return}
    if(newer&&S.rs!==m.rs){if(S.rs&&S.name)resetHere(m.rs);else{S.rs=m.rs;save()}}
    else if(S.rs!==m.rs&&!newer)return;            // state from before the last reset: ignore
  }
  if(m.reset)return;
  if(m.purge){if(m.sid===S.sid&&S.purged!==m.sid){S.purged=m.sid;S.pend=false;save();sync.clearOwn(S.pid)}return}
  /* clock offset (local − host) learned only from live MQTT messages; retained/ntfy-cached ones can be old */
  if(!retained&&src!=='ntfy'){const sk=Date.now()-m.ts;if(Math.abs(sk)<180000){S.skew=sk;save()}}
  if(C&&m.ts<=C.ts)return;
  if(m.ra&&typeof m.ra!=='object')m.ra={};
  if(m.phase==='open'&&typeof m.openAt==='number'&&typeof m.dur==='number')m.dl=m.openAt+m.dur*1000+S.skew+1500;
  if(S.sid!==m.sid){
    if(S.sid)S.hist[S.sid]={ans:S.ans,rt:S.rt,shown:S.shown};
    const h=S.hist[m.sid]||{};S.sid=m.sid;S.ans=h.ans||{};S.rt=h.rt||{};S.shown=h.shown||{};S.pend=false;
    const ks=Object.keys(S.hist);if(ks.length>6)delete S.hist[ks[0]];
    save();
  }
  const prev=C;C=m;
  const newSid=!prev||prev.sid!==m.sid;
  if(newSid||prev.phase!==m.phase||prev.q!==m.q||prev.openAt!==m.openAt){if(!editing)render();push(newSid&&S.name?'join':'sync')}
  else header();
}
var sync=QSync.create({topic:TP,role:'player',only:ONLY,onCtl,onStatus:s=>{NET=s;header()},onReconnect:()=>push(S.pend?'answer':'sync'),
  onFallback:on=>{header();if(on)push('answer')}});
render();sync.start();
/* re-send: pending answers every 4s; otherwise a light sync every 15s if nothing sent for 45s */
setInterval(()=>{if(S.pend&&S.name&&S.sid){push('answer').then(ok=>{if(ok&&C&&['open','closed'].includes(C.phase)&&!editing)render()})}},4000);
setInterval(()=>{if(S.name&&S.sid&&!S.pend&&Date.now()-lastSent>45000)push('sync')},15000);
addEventListener('online',()=>push(S.pend?'answer':'sync'));
}
</script>
